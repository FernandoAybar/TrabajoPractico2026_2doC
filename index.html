<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Vadodara:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./estilos CSS/styles-login.css">
    <link rel="icon" type="image/png" href="./imagenes/babylon_torre_recortada.png">
    <title>Babylon - Inicio Sesi&oacute;n</title>
</head>

<body class="login-body">

    <main class="login-conteiner">

        <section class="login-marca">
            <img src="./imagenes/babylon_torre_recortada.png" alt="Babylon Torre Logo" class="login-logo-torre">
            <img src="./imagenes/babylon_text_recortado.png" alt="Babylon nombre" class="login-logo-texto">
            <h1>!Te damos la bienvenida!</h1>
            <p>Aprende idiomas de forma l&uacute;dica y competitiva</p>
        </section>



        <form action="./Vistas/dashboard.html" method="post" class="login-formulario" data-netlify="true">

            <img src="./imagenes/Individual.gif" alt="Logo" class="Logo_principal">

            <section class="campo-grupo-login">
                <label for="usuario-login">Nombre de usuario</label>
                <input type="text" id="usuario-login" name="usuario-login" placeholder="Ingresa tu nombre de usuario" required>
            </section>


            <section class="campo-grupo-login">
                <label for="pass">Contraseña</label>
                <input type="password" name="pass" id="pass" placeholder="Ingresa tu Contraseña" required>
            </section>

            <section class="login-opciones-enlaces">
                <a href="./Vistas/recuperar-contraseña.html" class="link-olvido">¿Olvidaste t&uacute; contraseña?</a>
            </section>

             <button class="btn-ingresar" type="submit"> Ingresar</button> 

            <hr class="divisor-login">

            <section class="login-registro-invitacion">
                <p>¿No  tienes una cuenta a&uacute;n?</p>
                <a href="./Vistas/crear-cuenta.html" class="btn-crear-cuenta"> Crear Cuenta</a>
            </section>

           
            

        </form>


    </main>
</body>

</html>
